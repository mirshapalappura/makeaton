<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Brightloop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard.html">Brightloop</a>
            <div class="d-flex gap-3">
                <a class="nav-link" href="/dashboard.html">Dashboard</a>
                <a class="nav-link" href="/plans.html">Plans</a>
                <a class="nav-link" href="/subscriptions.html">Subscriptions</a>
                <a class="nav-link" href="/invoices.html">Invoices</a>
                <a class="nav-link" href="/payments.html">Payments</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h2>Product Management</h2>
        <p class="text-muted">View available subscription products.</p>

        <div class="card">
            <div class="card-body">
                <h5 class="mb-3">Available Products</h5>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product</th>
                                <th>Description</th>
                                <th>Price</th>
                                <th>Tax</th>
                            </tr>
                        </thead>
                        <tbody id="productsTable">
                            <tr>
                                <td colspan="5">Loading products...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="message" class="text-danger"></p>
            </div>
        </div>

        <div class="card" id="addProductCard" hidden>
            <div class="card-body">
                <h5>Add New Product</h5>

                <form id="productForm">
                    <div class="mb-3">
                        <label class="form-label" for="productName">Product Name</label>
                        <input class="form-control" id="productName" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="productDescription">Description</label>
                        <textarea class="form-control" id="productDescription"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="productPrice">Price</label>
                            <input class="form-control" id="productPrice"
                                   type="number" min="0" step="0.01" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="productTax">Tax Rate (%)</label>
                            <input class="form-control" id="productTax"
                                   type="number" min="0" max="100" value="18" required>
                        </div>
                    </div>

                    <button class="btn btn-primary" type="submit">Add Product</button>
                </form>

                <p id="formMessage" class="mt-3"></p>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        async function loadProducts() {
            const tbody = document.getElementById("productsTable");

            try {
                const products = await API.getProducts();
                tbody.replaceChildren();

                if (!products.length) {
                    const row = tbody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 5;
                    cell.textContent = "No products available.";
                    return;
                }

                products.forEach(product => {
                    const row = tbody.insertRow();

                    [
                        product.id,
                        product.name,
                        product.description || "-",
                        "₹" + Number(product.price).toFixed(2),
                        product.tax_rate + "%"
                    ].forEach(value => {
                        row.insertCell().textContent = value;
                    });
                });

            } catch (error) {
                document.getElementById("message").textContent = error.message;
            }
        }

        async function setupProductForm() {
            try {
                const user = await API.currentUser();

                if (["admin", "staff"].includes(user.role)) {
                    document.getElementById("addProductCard").hidden = false;
                }
            } catch (error) {
                window.location.href = "/login.html";
            }
        }

        document.getElementById("productForm").addEventListener("submit", async event => {
            event.preventDefault();

            const message = document.getElementById("formMessage");

            try {
                await API.addProduct({
                    name: document.getElementById("productName").value,
                    description: document.getElementById("productDescription").value,
                    price: Number(document.getElementById("productPrice").value),
                    tax_rate: Number(document.getElementById("productTax").value)
                });

                message.textContent = "Product added successfully!";
                message.className = "mt-3 text-success";

                event.target.reset();
                await loadProducts();

            } catch (error) {
                message.textContent = error.message;
                message.className = "mt-3 text-danger";
            }
        });

        setupProductForm();
        loadProducts();
    </script>

</body>
</html>
