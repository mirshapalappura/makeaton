<!DOCTYPE html>
<html>
<head>
    <title>Brightloop | Products</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark p-3">
    <a class="navbar-brand" href="dashboard.html">Brightloop</a>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
</nav>

<div class="container">
    <h2>Products</h2>

    <div class="card">
        <div class="card-body">
            <input id="product-name" class="form-control mb-2" placeholder="Product name">
            <input id="description" class="form-control mb-2" placeholder="Description">
            <input id="price" type="number" class="form-control mb-2" placeholder="Price">
            <input id="tax" type="number" class="form-control mb-3" value="18" placeholder="Tax rate (%)">
            <button class="btn btn-primary" onclick="addProduct()">Add product</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table">
                <thead>
                    <tr><th>Name</th><th>Description</th><th>Price</th><th>Tax</th></tr>
                </thead>
                <tbody id="product-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/products.js"></script>
</body>
</html>
