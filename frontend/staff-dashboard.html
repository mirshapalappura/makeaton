<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard | Brightloop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Brightloop Staff</a>
            <button class="btn btn-outline-light" onclick="logout()">Logout</button>
        </div>
    </nav>

    <main class="container" id="dashboardContent" hidden>
        <h2 id="welcome">Staff Dashboard</h2>
        <p class="text-muted">Manage daily subscription operations.</p>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Products</h5>
                        <p>Add and view products.</p>
                        <a href="/products.html" class="btn btn-primary">Products</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Subscriptions</h5>
                        <p>Manage subscription statuses.</p>
                        <a href="/subscriptions.html" class="btn btn-primary">Subscriptions</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Payments</h5>
                        <p>Record customer payments.</p>
                        <a href="/payments.html" class="btn btn-primary">Payments</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/role.js"></script>
    <script>
        (async () => {
            const user = await checkRole(["staff"]);

            if (user) {
                document.getElementById("dashboardContent").hidden = false;
            }
        })();
    </script>

</body>
</html>
