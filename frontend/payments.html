<!DOCTYPE html>
<html>
<head>
    <title>Brightloop | Payments</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark p-3">
    <a class="navbar-brand" href="dashboard.html">Brightloop</a>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
</nav>

<div class="container">
    <h2>Payments</h2>

    <div class="card">
        <div class="card-body">
            <input id="invoice-id" type="number" class="form-control mb-2" placeholder="Invoice ID">
            <input id="amount" type="number" step="0.01" class="form-control mb-2" placeholder="Payment amount">

            <select id="method" class="form-select mb-3">
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Cash">Cash</option>
            </select>

            <button class="btn btn-primary" onclick="addPayment()">Record payment</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table">
                <thead>
                    <tr><th>Payment ID</th><th>Invoice ID</th><th>Amount</th><th>Method</th><th>Date</th></tr>
                </thead>
                <tbody id="payment-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/billing.js"></script>
</body>
</html>
