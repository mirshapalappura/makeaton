<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | Brightloop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard.html">Brightloop</a>
            <a class="btn btn-outline-light btn-sm" href="/dashboard.html">Dashboard</a>
        </div>
    </nav>

    <main class="container">
        <h2>Payment Management</h2>

        <div class="card" id="paymentFormCard" hidden>
            <div class="card-body">
                <h5>Record Payment</h5>

                <form id="paymentForm">
                    <div class="mb-3">
                        <label for="invoiceId" class="form-label">Invoice ID</label>
                        <input type="number" min="1" class="form-control"
                               id="invoiceId" required>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (₹)</label>
                        <input type="number" min="0.01" step="0.01"
                               class="form-control" id="amount" required>
                    </div>

                    <div class="mb-3">
                        <label for="paymentMethod" class="form-label">Payment Method</label>
                        <select id="paymentMethod" class="form-select">
                            <option value="UPI">UPI</option>
                            <option value="Card">Card</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Cash">Cash</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Record Payment
                    </button>
                </form>

                <p id="formMessage" class="mt-3"></p>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5>Payment History</h5>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Payment ID</th>
                                <th>Invoice ID</th>
                                <th>Amount</th>
                                <th>Method</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="paymentsTable">
                            <tr>
                                <td colspan="5">Loading payments...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="message" class="text-danger"></p>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        async function loadPayments() {
            const tbody = document.getElementById("paymentsTable");

            try {
                const payments = await API.getPayments();
                tbody.replaceChildren();

                if (!payments.length) {
                    const row = tbody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 5;
                    cell.textContent = "No payments recorded.";
                    return;
                }

                payments.forEach(payment => {
                    const row = tbody.insertRow();

                    [
                        payment.id,
                        payment.invoice_id,
                        "₹" + Number(payment.amount).toFixed(2),
                        payment.payment_method,
                        payment.created_at
                    ].forEach(value => {
                        row.insertCell().textContent = value;
                    });
                });

            } catch (error) {
                document.getElementById("message").textContent = error.message;
            }
        }

        async function setupPaymentForm() {
            try {
                const user = await API.currentUser();

                if (["admin", "staff"].includes(user.role)) {
                    document.getElementById("paymentFormCard").hidden = false;
                }
            } catch (error) {
                window.location.href = "/login.html";
            }
        }

        document.getElementById("paymentForm").addEventListener("submit", async event => {
            event.preventDefault();

            const message = document.getElementById("formMessage");

            try {
                const result = await API.addPayment({
                    invoice_id: Number(document.getElementById("invoiceId").value),
                    amount: Number(document.getElementById("amount").value),
                    payment_method: document.getElementById("paymentMethod").value
                });

                message.textContent = result.message + " — " + result.status;
                message.className = "mt-3 text-success";

                event.target.reset();
                await loadPayments();

            } catch (error) {
                message.textContent = error.message;
                message.className = "mt-3 text-danger";
            }
        });

        setupPaymentForm();
        loadPayments();
    </script>

</body>
</html>
