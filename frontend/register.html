<!DOCTYPE html>
<html>
<head>
    <title>Brightloop | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card login-card">
        <div class="card-body">
            <h2 class="text-center">Create Account</h2>

            <label>Name</label>
            <input id="name" class="form-control mb-3">

            <label>Email</label>
            <input id="email" type="email" class="form-control mb-3">

            <label>Password</label>
            <input id="password" type="password" class="form-control mb-3">

            <button onclick="register()" class="btn btn-primary w-100">
                Register
            </button>

            <p class="text-center mt-3">
                Already registered? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
