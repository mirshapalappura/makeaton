<!DOCTYPE html>
<html>
<head>
    <title>Brightloop | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Brightloop</a>
        <div>
            <a class="nav-link d-inline" href="products.html">Products</a>
            <a class="nav-link d-inline" href="plans.html">Plans</a>
            <a class="nav-link d-inline" href="subscriptions.html">Subscriptions</a>
            <a class="nav-link d-inline" href="invoices.html">Invoices</a>
            <a class="nav-link d-inline" href="payments.html">Payments</a>
            <button class="btn btn-sm btn-light" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Dashboard</h2>
    <div class="row">
        <div class="col-md-4"><div class="card"><div class="card-body">
            Active subscriptions
            <div class="stat-number" id="active">0</div>
        </div></div></div>

        <div class="col-md-4"><div class="card"><div class="card-body">
            Customers
            <div class="stat-number" id="customers">0</div>
        </div></div></div>

        <div class="col-md-4"><div class="card"><div class="card-body">
            Revenue
            <div class="stat-number" id="revenue">₹0</div>
        </div></div></div>

        <div class="col-md-4"><div class="card"><div class="card-body">
            Outstanding
            <div class="stat-number" id="outstanding">₹0</div>
        </div></div></div>

        <div class="col-md-4"><div class="card"><div class="card-body">
            Overdue invoices
            <div class="stat-number" id="overdue">0</div>
        </div></div></div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
