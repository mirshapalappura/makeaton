<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Brightloop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard.html">Brightloop</a>
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link" href="/products.html">Products</a>
                <a class="nav-link" href="/plans.html">Plans</a>
                <a class="nav-link" href="/subscriptions.html">Subscriptions</a>
                <a class="nav-link" href="/invoices.html">Invoices</a>
                <a class="nav-link" href="/payments.html">Payments</a>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <h2 id="welcome">Dashboard</h2>
        <p class="text-muted" id="role">Checking your account...</p>

        <div class="row">
            <div class="col-md-4">
                <div class="card"><div class="card-body">
                    <h5>Products</h5>
                    <p class="text-muted">Browse available products.</p>
                    <a href="/products.html" class="btn btn-primary">View Products</a>
                </div></div>
            </div>

            <div class="col-md-4">
                <div class="card"><div class="card-body">
                    <h5>Subscriptions</h5>
                    <p class="text-muted">Manage subscription statuses.</p>
                    <a href="/subscriptions.html" class="btn btn-primary">View Subscriptions</a>
                </div></div>
            </div>

            <div class="col-md-4">
                <div class="card"><div class="card-body">
                    <h5>Billing</h5>
                    <p class="text-muted">Review invoices and payments.</p>
                    <a href="/invoices.html" class="btn btn-primary">View Invoices</a>
                </div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5>Quick Navigation</h5>
                <a href="/plans.html" class="btn btn-outline-primary me-2">Plans</a>
                <a href="/payments.html" class="btn btn-outline-primary">Payments</a>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        async function loadDashboard() {
            try {
                const user = await API.currentUser();
                document.getElementById("welcome").textContent = `Welcome, ${user.name}`;
                document.getElementById("role").textContent = `Account role: ${user.role}`;
            } catch (error) {
                window.location.href = "/login.html";
            }
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            try {
                await API.logout();
                window.location.href = "/login.html";
            } catch (error) {
                alert(error.message);
            }
        });

        loadDashboard();
    </script>
</body>
</html>
