<!DOCTYPE html>
<html>
<head>
    <title>Brightloop | Invoices</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark p-3">
    <a class="navbar-brand" href="dashboard.html">Brightloop</a>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
</nav>

<div class="container">
    <h2>Invoices</h2>

    <button class="btn btn-primary mb-3" onclick="generateInvoices()">
        Generate invoices
    </button>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th><th>Subtotal</th><th>Tax</th>
                        <th>Total</th><th>Paid</th><th>Status</th><th>Due date</th>
                    </tr>
                </thead>
                <tbody id="invoice-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/billing.js"></script>
</body>
</html>
