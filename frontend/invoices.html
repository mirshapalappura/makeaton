<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices | Brightloop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard.html">Brightloop</a>
            <a class="btn btn-outline-light btn-sm" href="/dashboard.html">Dashboard</a>
        </div>
    </nav>

    <main class="container">
        <h2>Invoice Management</h2>

        <button id="generateBtn" class="btn btn-primary mb-3" hidden>
            Generate Invoices
        </button>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Invoice ID</th>
                                <th>Subscription</th>
                                <th>Subtotal</th>
                                <th>Tax</th>
                                <th>Total</th>
                                <th>Paid</th>
                                <th>Status</th>
                                <th>Due Date</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesTable">
                            <tr>
                                <td colspan="8">Loading invoices...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="message"></p>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        async function loadInvoices() {
            const tbody = document.getElementById("invoicesTable");
            const message = document.getElementById("message");

            try {
                const invoices = await API.getInvoices();
                tbody.replaceChildren();

                if (!invoices.length) {
                    const row = tbody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 8;
                    cell.textContent = "No invoices found.";
                    return;
                }

                invoices.forEach(invoice => {
                    const row = tbody.insertRow();

                    [
                        invoice.id,
                        invoice.subscription_id,
                        "₹" + Number(invoice.subtotal).toFixed(2),
                        "₹" + Number(invoice.tax).toFixed(2),
                        "₹" + Number(invoice.total).toFixed(2),
                        "₹" + Number(invoice.paid_amount).toFixed(2),
                        invoice.status,
                        invoice.due_date
                    ].forEach(value => {
                        row.insertCell().textContent = value;
                    });
                });

            } catch (error) {
                message.textContent = error.message;
                message.className = "text-danger";
            }
        }

        async function setupInvoiceActions() {
            try {
                const user = await API.currentUser();

                if (["admin", "staff"].includes(user.role)) {
                    document.getElementById("generateBtn").hidden = false;
                }
            } catch (error) {
                window.location.href = "/login.html";
            }
        }

        document.getElementById("generateBtn").addEventListener("click", async () => {
            const message = document.getElementById("message");

            try {
                const result = await API.generateInvoices();

                message.textContent = result.message;
                message.className = "text-success";

                await loadInvoices();

            } catch (error) {
                message.textContent = error.message;
                message.className = "text-danger";
            }
        });

        setupInvoiceActions();
        loadInvoices();
    </script>

</body>
</html>
