<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | Brightloop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Brightloop Customer</a>
            <button class="btn btn-outline-light" onclick="logout()">Logout</button>
        </div>
    </nav>

    <main class="container" id="dashboardContent" hidden>
        <h2 id="welcome">Customer Dashboard</h2>
        <p class="text-muted">Manage your subscriptions and billing.</p>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Products</h5>
                        <p>Browse available products.</p>
                        <a href="/products.html" class="btn btn-primary">Browse Products</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>My Subscriptions</h5>
                        <p>View your active subscriptions.</p>
                        <a href="/subscriptions.html" class="btn btn-primary">My Subscriptions</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>My Invoices</h5>
                        <p>View your billing history.</p>
                        <a href="/invoices.html" class="btn btn-primary">My Invoices</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/role.js"></script>
    <script>
        (async () => {
            const user = await checkRole(["customer"]);

            if (user) {
                document.getElementById("dashboardContent").hidden = false;
            }
        })();
    </script>

</body>
</html>
