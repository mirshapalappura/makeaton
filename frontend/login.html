<!DOCTYPE html>
<html>
<head>
    <title>Brightloop | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card login-card">
        <div class="card-body">
            <h2 class="text-center">Brightloop</h2>
            <p class="text-center text-muted">Subscription Management</p>

            <label>Email</label>
            <input id="email" type="email" class="form-control mb-3">

            <label>Password</label>
            <input id="password" type="password" class="form-control mb-3">

            <button onclick="login()" class="btn btn-primary w-100">
                Login
            </button>

            <p class="text-center mt-3">
                New user? <a href="register.html">Register</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
