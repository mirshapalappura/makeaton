<!DOCTYPE html>
<html>
<head>
    <title>Brightloop | Plans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark p-3">
    <a class="navbar-brand" href="dashboard.html">Brightloop</a>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
</nav>

<div class="container">
    <h2>Subscription Plans</h2>

    <div class="card">
        <div class="card-body">
            <input id="plan-name" class="form-control mb-2" placeholder="Plan name">
            <input id="plan-price" type="number" class="form-control mb-2" placeholder="Price">
            <select id="cycle" class="form-select mb-2">
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
            </select>
            <input id="plan-description" class="form-control mb-3" placeholder="Description">
            <button class="btn btn-primary" onclick="addPlan()">Add plan</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table">
                <thead><tr><th>Name</th><th>Price</th><th>Cycle</th><th>Description</th></tr></thead>
                <tbody id="plan-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
async function loadPlansPage() {
    const plans = await api("/api/plans");
    document.getElementById("plan-list").innerHTML = plans.map(p => `
        <tr><td>${p.name}</td><td>₹${p.price}</td>
        <td>${p.billing_cycle}</td><td>${p.description || ""}</td></tr>
    `).join("");
}

async function addPlan() {
    try {
        await api("/api/plans", "POST", {
            name: document.getElementById("plan-name").value,
            price: document.getElementById("plan-price").value,
            billing_cycle: document.getElementById("cycle").value,
            description: document.getElementById("plan-description").value
        });
        alert("Plan added");
        loadPlansPage();
    } catch (error) {
        alert(error.message);
    }
}

loadPlansPage();
</script>
</body>
</html>
