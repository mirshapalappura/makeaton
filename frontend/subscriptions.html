<!DOCTYPE html>
<html>
<head>
    <title>Brightloop | Subscriptions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark p-3">
    <a class="navbar-brand" href="dashboard.html">Brightloop</a>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
</nav>

<div class="container">
    <h2>Subscriptions</h2>

    <div class="card">
        <div class="card-body">
            <label>Select plan</label>
            <select id="plan-id" class="form-select mb-3"></select>
            <button class="btn btn-primary" onclick="createSubscription()">
                Create subscription
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table">
                <thead>
                    <tr><th>ID</th><th>Plan</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="subscription-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/subscriptions.js"></script>
</body>
</html>
