<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriptions | Brightloop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard.html">Brightloop</a>
            <a class="btn btn-outline-light btn-sm" href="/dashboard.html">Dashboard</a>
        </div>
    </nav>

    <main class="container">
        <h2>Subscription Management</h2>
        <p class="text-muted">Track customer subscriptions and their statuses.</p>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Plan</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                            </tr>
                        </thead>
                        <tbody id="subscriptionsTable">
                            <tr>
                                <td colspan="7">Loading subscriptions...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="message" class="text-danger"></p>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        async function loadSubscriptions() {
            const tbody = document.getElementById("subscriptionsTable");

            try {
                const subscriptions = await API.getSubscriptions();
                tbody.replaceChildren();

                if (!subscriptions.length) {
                    const row = tbody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 7;
                    cell.textContent = "No subscriptions found.";
                    return;
                }

                subscriptions.forEach(sub => {
                    const row = tbody.insertRow();

                    [
                        sub.id,
                        sub.customer_name || "My Subscription",
                        sub.plan_name,
                        "₹" + Number(sub.price).toFixed(2),
                        sub.status,
                        sub.start_date || "-",
                        sub.end_date || "-"
                    ].forEach(value => {
                        row.insertCell().textContent = value;
                    });
                });

            } catch (error) {
                document.getElementById("message").textContent = error.message;
            }
        }

        loadSubscriptions();
    </script>

</body>
</html>
